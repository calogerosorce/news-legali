name: Aggiorna news legali

on:
  schedule:
    - cron: '23 */3 * * *'   # ogni 3 ore
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', 'tests/**', 'config/**', '.github/workflows/**']

permissions:
  contents: write

concurrency:
  group: aggiorna-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Test dei parser (copie salvate delle fonti)
        run: node --test tests/sources.test.mjs

      - name: Raccolta notizie dalle fonti ufficiali
        id: build
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/build.mjs

      - name: Pubblica i JSON aggiornati
        run: |
          git config user.name  "news-legali-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api data
          if git diff --cached --quiet; then
            echo "Nessuna modifica."
            exit 0
          fi
          git commit -m "news: aggiornamento $(date -u +'%Y-%m-%d %H:%M') UTC"
          # Se nel frattempo è arrivato un altro commit (altro giro o modifica al codice),
          # riallinea e riprova: sui file generati (api/, data/) vince questo giro.
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "Push rifiutato, riallineo e riprovo ($i/5)…"
            sleep $((i * 5))
            git pull --rebase -X theirs origin main || { git rebase --abort; git pull --no-rebase -X ours origin main; }
          done
          echo "::error::Impossibile pubblicare i JSON dopo 5 tentativi."
          exit 1

      - name: Allarme (email da GitHub se una fonte è ferma)
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::Una o più fonti non rispondono da oltre 72 ore. Controlla api/status.json."
          exit 1
