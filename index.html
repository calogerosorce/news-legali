<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>News legali — stato dell'hub</title>
<style>
 body{font-family:system-ui,sans-serif;max-width:900px;margin:40px auto;padding:0 20px;color:#1c1d21}
 h1{margin-bottom:4px} .muted{color:#6b6f7a}
 table{width:100%;border-collapse:collapse;margin:20px 0} td,th{padding:10px;border-bottom:1px solid #e4e4e8;text-align:left;font-size:.92rem}
 .ok{color:#147a3d;font-weight:600}.ko{color:#b3261e;font-weight:600}
 a{color:#8a6d3b} code{background:#f2f2f4;padding:2px 6px;border-radius:5px}
</style>
</head>
<body>
<h1>News legali — hub</h1>
<p class="muted">Raccolta automatica da fonti istituzionali, aggiornata ogni 3 ore. <span id="upd"></span></p>
<p><a href="demo/">Apri la demo del widget →</a></p>
<table><thead><tr><th>Fonte</th><th>Stato</th><th>Notizie ultimo giro</th><th>Ultimo successo</th></tr></thead><tbody id="rows"><tr><td colspan="4">Caricamento…</td></tr></tbody></table>
<h3>Endpoint</h3>
<p id="areas" class="muted"></p>
<script>
 const f=d=>d?new Date(d).toLocaleString('it-IT'):'—';
 const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 fetch('api/status.json',{cache:'no-cache'}).then(r=>r.json()).then(s=>{
  document.getElementById('upd').textContent='Ultimo giro: '+f(s.updatedAt)+' — '+s.totalItems+' notizie in archivio'+(s.ai&&s.ai.enabled?' — spiegazioni AI attive':'')+'.';
  document.getElementById('rows').innerHTML=s.sources.map(x=>`<tr><td><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.label)}</a></td><td class="${x.lastError?'ko':'ok'}">${x.lastError?'Errore: '+esc(x.lastError):'OK'}</td><td>${x.lastCount??'—'}</td><td>${f(x.lastOk)}</td></tr>`).join('');
 });
 fetch('api/areas.json',{cache:'no-cache'}).then(r=>r.json()).then(a=>{
  document.getElementById('areas').innerHTML=a.areas.map(x=>`<code><a href="${esc(x.url)}">${esc(x.url)}</a></code> ${esc(x.label)} (${x.count})`).join('<br>');
 });
</script>
</body>
</html>
